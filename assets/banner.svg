<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
      
      /* Dynamic pulses and floating animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }

      .floating-card-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-card-2 { animation: floatSlow 8s ease-in-out infinite reverse; }
      .pulse-bg { animation: pulseGlow 4s ease-in-out infinite; }
      .animated-line { stroke-dasharray: 8 8; animation: dashMove 2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Dynamic Decorative Circles -->
  <circle cx="150" cy="80" r="180" fill="url(#glowGrad)" class="pulse-bg"/>
  <circle cx="1050" cy="240" r="220" fill="url(#glowGrad)" class="pulse-bg"/>

  <!-- Decorative Grid Pattern Background (Low Opacity) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200"/>
    <path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320 M1000 0 V320 M1100 0 V320"/>
  </g>

  <!-- Dynamic Animated Floating Cards in Background (Behind Text) -->
  <g class="floating-card-1" opacity="0.25">
    <rect x="820" y="40" width="280" height="110" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect x="840" y="60" width="120" height="10" rx="5" fill="#64748b"/>
    <rect x="840" y="80" width="200" height="8" rx="4" fill="#334155"/>
    <rect x="840" y="98" width="160" height="8" rx="4" fill="#334155"/>
    <circle cx="1060" cy="65" r="12" fill="#10b981"/>
  </g>

  <g class="floating-card-2" opacity="0.25">
    <rect x="760" y="170" width="320" height="110" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect x="780" y="190" width="140" height="10" rx="5" fill="#a855f7"/>
    <rect x="780" y="212" width="220" height="8" rx="4" fill="#334155"/>
    <rect x="780" y="230" width="170" height="8" rx="4" fill="#334155"/>
    <rect x="1010" y="190" width="50" height="20" rx="10" fill="#6366f1"/>
  </g>

  <!-- Dynamic Connecting Line -->
  <path d="M 700 160 Q 760 100 820 100" stroke="url(#accentGrad)" stroke-width="2" fill="none" class="animated-line" opacity="0.4"/>

  <!-- Top Decorative Pill / Badge -->
  <g transform="translate(80, 50)">
    <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" filter="url(#shadow)"/>
    <circle cx="20" cy="16" r="6" fill="#38bdf8" class="pulse-bg"/>
    <text x="36" y="21" class="badge-text">⚡ CURATED WORK MANAGEMENT DISCOVERY</text>
  </g>

  <!-- Title & Subtitle (Always Clear Foreground) -->
  <g transform="translate(80, 140)">
    <text x="0" y="0" class="title" filter="url(#shadow)">Awesome Work Management 🚀</text>
    <text x="0" y="42" class="subtitle">Top SaaS &amp; Open-Source Tools for Task Tracking, Project Planning &amp; Team Productivity</text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="80" y="235" width="480" height="6" rx="3" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Stat Pills in Foreground -->
  <g transform="translate(80, 260)">
    <rect x="0" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="12" y="18" font-family="sans-serif" font-size="12" fill="#94a3b8">📊 SaaS &amp; Open Source</text>

    <rect x="155" y="0" width="130" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="167" y="18" font-family="sans-serif" font-size="12" fill="#94a3b8">⭐ Star-Sorted Repos</text>

    <rect x="298" y="0" width="130" height="28" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="310" y="18" font-family="sans-serif" font-size="12" fill="#94a3b8">💼 Market Analysis</text>
  </g>
</svg>
